name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag matching package.json, for example v0.1.8"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other installer.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: pack:linux
            artifact: linux
          - os: windows-latest
            command: pack:windows
            artifact: windows
          - os: macos-latest
            command: pack:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # app-builder-lib loads an ESM hashing dependency through require().
          # Node 24 supports that bridge reliably on every hosted runner.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate source and dependencies
        run: npm run lint
      - name: Run integration and Windows-path regression tests
        run: npm test
      - name: Prepare macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 assets/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - name: Build desktop package
        # electron-builder downloads platform tools during packaging. Retry once
        # so a transient GitHub/CDN connection does not lose the whole release.
        run: node scripts/build-desktop-ci.mjs ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: promptde-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Add dependency-aware Linux installer
        shell: bash
        run: |
          cp scripts/install-desktop.sh release-assets/install-promptde-linux.sh
          chmod 755 release-assets/install-promptde-linux.sh
      - name: Upload installers to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          draft: true
          generate_release_notes: true
          body: |
            ## Linux installation

            Use the Debian package where supported, or run the dependency-aware installer:

            ```sh
            curl -fsSL https://github.com/ITISH7/PromptDe/releases/latest/download/install-promptde-linux.sh | sh
            ```

            The installer detects X11 or Wayland and installs missing shortcut helpers. Existing dependencies are left untouched.
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/install-promptde-linux.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          release_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
              jq -r --arg tag "$RELEASE_TAG" \
                '.[] | select(.tag_name == $tag and .draft == true) | .id' |
              head -n 1
          )"

          if [[ -z "$release_id" ]]; then
            echo "::error title=Draft release not found::No draft release exists for $RELEASE_TAG"
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --field draft=false
