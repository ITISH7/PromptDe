<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">How PromptDe turns an idea into an agent-ready prompt</title>
  <desc id="description">A four-step flow from speaking or typing, through transcription and prompt compilation, to copying or pasting into a coding agent. Translation can also go directly from transcription to the clipboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#121625"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff704b"/>
      <stop offset="1" stop-color="#a88bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7890"/>
    </marker>
  </defs>

  <rect width="1400" height="430" rx="28" fill="url(#background)"/>
  <text x="70" y="67" fill="#f4f6fb" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">From rough idea to precise instruction</text>
  <text x="70" y="99" fill="#8f98ad" font-family="Inter,Segoe UI,sans-serif" font-size="16">Speak naturally in Hindi, English, or Hinglish—or type instead.</text>

  <g fill="none" stroke="#6f7890" stroke-width="3" marker-end="url(#arrow)">
    <path d="M330 232 H405"/>
    <path d="M655 232 H730"/>
    <path d="M980 232 H1055"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="260" height="174" rx="20" fill="#151a28" stroke="#ff704b" stroke-opacity=".5"/>
    <rect x="405" y="145" width="250" height="174" rx="20" fill="#151a28" stroke="#343b50"/>
    <rect x="730" y="145" width="250" height="174" rx="20" fill="#151a28" stroke="#7d68d9" stroke-opacity=".65"/>
    <rect x="1055" y="145" width="275" height="174" rx="20" fill="#151a28" stroke="#50d890" stroke-opacity=".55"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(98 174)">
      <circle cx="27" cy="27" r="27" fill="#ff6240"/>
      <path d="M27 15a7 7 0 0 0-7 7v10a7 7 0 0 0 14 0V22a7 7 0 0 0-7-7Zm-13 16v2a13 13 0 0 0 26 0v-2M27 46v8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" fill="#ff8061" font-size="13" font-weight="700" letter-spacing="1.4">01 · CAPTURE</text>
      <text x="0" y="113" fill="#f4f6fb" font-size="22" font-weight="700">Speak or type</text>
      <text x="0" y="140" fill="#8f98ad" font-size="15">Your idea, in your words</text>
    </g>

    <g transform="translate(433 174)">
      <rect width="54" height="54" rx="14" fill="#232a3d"/>
      <path d="M13 29h5l4-12 7 23 5-18 4 7h4" fill="none" stroke="#aeb7ca" stroke-width="3" stroke-linejoin="round"/>
      <text x="0" y="83" fill="#aeb7ca" font-size="13" font-weight="700" letter-spacing="1.4">02 · TRANSCRIBE</text>
      <text x="0" y="113" fill="#f4f6fb" font-size="22" font-weight="700">Speech to text</text>
      <text x="0" y="140" fill="#8f98ad" font-size="15">Groq Whisper</text>
    </g>

    <g transform="translate(758 174)">
      <rect width="54" height="54" rx="14" fill="#2a2447"/>
      <path d="M18 17h18M18 27h13M18 37h18" fill="none" stroke="#b39bff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" fill="#b39bff" font-size="13" font-weight="700" letter-spacing="1.4">03 · REFINE</text>
      <text x="0" y="113" fill="#f4f6fb" font-size="22" font-weight="700">Compile prompt</text>
      <text x="0" y="140" fill="#8f98ad" font-size="15">Groq or Gemini</text>
    </g>

    <g transform="translate(1083 174)">
      <rect width="54" height="54" rx="14" fill="#173529"/>
      <path d="M18 16h24v28H18zM24 10h24v28" fill="none" stroke="#65e29d" stroke-width="3" stroke-linejoin="round"/>
      <text x="0" y="83" fill="#65e29d" font-size="13" font-weight="700" letter-spacing="1.4">04 · USE</text>
      <text x="0" y="113" fill="#f4f6fb" font-size="22" font-weight="700">Copy or paste</text>
      <text x="0" y="140" fill="#8f98ad" font-size="15">Into your coding agent</text>
    </g>
  </g>

  <path d="M530 319v45h662v-45" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 7" opacity=".7"/>
  <rect x="725" y="348" width="272" height="44" rx="22" fill="#1b2030" stroke="#454e68"/>
  <text x="861" y="376" text-anchor="middle" fill="#c7cede" font-family="Inter,Segoe UI,sans-serif" font-size="14">Translation-only shortcut</text>
</svg>
