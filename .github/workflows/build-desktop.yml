name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag matching package.json, for example v0.1.5"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other installer.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: pack:linux
            artifact: linux
          - os: windows-latest
            command: pack:windows
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # app-builder-lib loads an ESM hashing dependency through require().
          # Node 24 supports that bridge reliably on every hosted runner.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build desktop package
        # electron-builder downloads platform tools during packaging. Retry once
        # so a transient GitHub/CDN connection does not lose the whole release.
        run: node scripts/build-desktop-ci.mjs ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: promptde-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail

          release_state="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft,assets \
              --jq '[.isDraft, (.assets | length)] | @tsv' 2>/dev/null || true
          )"

          if [[ -z "$release_state" ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --draft
          elif [[ "$release_state" != true$'\t'* ]]; then
            echo "Release $RELEASE_TAG is already published; leaving it unchanged."
            exit 0
          fi

          while IFS= read -r -d '' asset; do
            echo "Uploading $(basename "$asset")"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done < <(find release-assets -type f -print0)

          gh release edit "$RELEASE_TAG" --draft=false
